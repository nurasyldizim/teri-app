  html { -webkit-text-size-adjust: 100%; }
  body {

  .closed h1 { font-size: 28px; line-height: 1.2; margin: 18px 0 6px; text-wrap: balance; }
  .closed .from { color: var(--muted); margin: 0; }
  .gift { position: relative; width: 210px; height: 200px; margin: 26px auto 10px; border: 0; background: none; cursor: pointer; padding: 0;
          -webkit-tap-highlight-color: transparent; animation: wiggle 2.6s ease-in-out infinite; }
  .gift:focus-visible { outline: 3px solid var(--accent); outline-offset: 8px; border-radius: 16px; }
  .gift .box { position: absolute; left: 20px; right: 20px; bottom: 0; height: 128px; border-radius: 10px;
               background: var(--accent); background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 78%, #000));
               box-shadow: 0 18px 30px rgba(0,0,0,.18); }
  .gift .lid { position: absolute; left: 8px; right: 8px; top: 46px; height: 40px; border-radius: 10px; z-index: 2;

  .gift .rib-v { position: absolute; left: 50%; width: 30px; margin-left: -15px; background: var(--paper); opacity: .92; border-radius: 4px;

  .gift .rib-v.top { top: 46px; height: 40px; z-index: 3; }
  .gift .rib-v.low { top: 86px; bottom: 0; z-index: 1; }
  .gift .bow { position: absolute; left: 50%; top: -2px; transform: translateX(-50%); line-height: 0; z-index: 4; color: var(--paper);
               filter: drop-shadow(0 3px 4px rgba(0,0,0,.18));
               transition: transform .6s cubic-bezier(.2,.9,.3,1.3), opacity .5s .25s; }
  .gift.open { animation: none; }
  .gift.open .lid, .gift.open .rib-v.top { transform: translateY(-130px) rotate(-18deg); opacity: 0; }
  .gift.open .bow { transform: translateX(-50%) translateY(-150px) rotate(-24deg); opacity: 0; }
  .tap { color: var(--muted); font-size: 14px; margin: 4px 0 18px; }

  .to { text-align: center; color: var(--muted); margin: 0 0 12px; font-weight: 600; }

  .sign { font-family: "Caveat", "Segoe Print", cursive; font-size: 25px; text-align: right; margin: 2px 8px 0; color: var(--muted); overflow-wrap: anywhere; }

  .sum .amount { font-size: 30px; font-weight: 800; color: var(--accent); white-space: nowrap; }
  .about { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  .code { margin: 16px 0 0; background: var(--soft); border-radius: 16px; padding: 14px; text-align: center; }

  }

  document.querySelectorAll('[data-lang]').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); setLang(a.getAttribute('data-lang')); });
  });
  var saved = store('teri.lang');
  // a demo link may ask for a language (?l=kk / ?l=ru) so it can be shown either way; a real card
  // keeps opening in the sender's language (see load()), so ?l= is honoured for demos only
  var askLang = (new URLSearchParams(location.search).get('l') || '').toLowerCase();
  lang = demo && (askLang === 'kk' || askLang === 'ru') ? askLang
    : saved === 'kk' || saved === 'ru' ? saved
    : /^kk/i.test(navigator.language || '') ? 'kk' : 'ru';
  load();
</script>
</body>
</html>
